name: Validate Hangover Shakes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all JavaScript syntax
        run: |
          for file in app.js menu-data.js ordering-config.js ordering.js admin.js table-qr.js cms-public.js cms-admin.js cms-kitchen.js tests/ordering-contract.test.cjs tests/cms-contract.test.cjs; do
            node --check "$file"
          done

      - name: Validate menu, dine-in and CMS contracts
        run: |
          node tests/ordering-contract.test.cjs
          node tests/cms-contract.test.cjs

      - name: Check required website files
        run: |
          for file in index.html admin.html table-qr.html manage.html style.css updates.css app.js menu-data.js ordering.js ordering.css dinein.css admin.js table-qr.js ordering-config.js supabase-realtime-policies.sql ORDERING_SETUP.md FRIEND_DEPLOY_HANDOFF.md tests/ordering-contract.test.cjs tests/cms-contract.test.cjs cms-schema.sql cms-public.js cms-admin.js cms-kitchen.js cms.css assets/logo.png assets/crew.png; do
            test -s "$file"
          done

      - name: Validate all HTML documents and local references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path('.')
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag in {'script', 'img'} and data.get('src'):
                      self.refs.append(data['src'])
                  if tag == 'link' and data.get('href'):
                      self.refs.append(data['href'])

          for html_file in ('index.html', 'admin.html', 'table-qr.html', 'manage.html'):
              html = (root / html_file).read_text(encoding='utf-8')
              parser = Parser()
              parser.feed(html)
              missing = []
              for ref in parser.refs:
                  if ref.startswith(('http://', 'https://', 'data:', '#')):
                      continue
                  path = ref.split('?', 1)[0].split('#', 1)[0]
                  if path and not (root / path).is_file():
                      missing.append(path)
              if missing:
                  raise SystemExit(f'{html_file} missing: ' + ', '.join(sorted(set(missing))))
              if not html.lstrip().lower().startswith('<!doctype html>') or '</html>' not in html.lower():
                  raise SystemExit(f'{html_file} invalid doctype or closing tag')
              print(f'{html_file}: local references OK')
          PY
