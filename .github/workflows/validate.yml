name: Validate Hangover Shakes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check menu-data.js

      - name: Check required website files
        run: |
          test -s index.html
          test -s style.css
          test -s updates.css
          test -s app.js
          test -s menu-data.js
          test -s assets/logo.png
          test -s assets/crew.png

      - name: Validate local HTML references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag in {'script', 'img'} and data.get('src'):
                      self.refs.append(data['src'])
                  if tag == 'link' and data.get('href'):
                      self.refs.append(data['href'])

          parser = Parser()
          parser.feed(html)
          missing = []
          for ref in parser.refs:
              if ref.startswith(('http://', 'https://', 'data:', '#')):
                  continue
              path = ref.split('?', 1)[0].split('#', 1)[0]
              if path and not (root / path).exists():
                  missing.append(path)

          if missing:
              raise SystemExit('Missing local references: ' + ', '.join(sorted(set(missing))))

          if not html.lstrip().lower().startswith('<!doctype html>'):
              raise SystemExit('index.html does not start with a doctype')
          if '</html>' not in html.lower():
              raise SystemExit('index.html is missing closing html tag')

          print('HTML references OK')
          PY
