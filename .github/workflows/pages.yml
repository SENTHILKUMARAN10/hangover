name: Refresh Hangover Shakes artwork safely

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh approved image assets without touching website functionality
        shell: bash
        run: |
          set -euo pipefail
          base="https://hangover-shakes-tiruppur.senthilkumaran539.chatgpt.site"
          files=(
            assets/alan.png
            assets/brownie.jpg
            assets/burger.jpg
            assets/crew.png
            assets/fries.jpg
            assets/hero.jpg
            assets/logo.jpg
            assets/logo.png
            assets/momos.jpg
            assets/portraits.png
            assets/sandwich.jpg
          )
          mkdir -p assets
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 --retry-delay 2 "${base}/${file}" --output "${file}"
          done

      - name: Commit image updates only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh cafe artwork without changing ordering"
            git push
          fi
