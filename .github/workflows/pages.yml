name: Refresh Hangover Shakes source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the latest approved website
        shell: bash
        run: |
          set -euo pipefail
          base="https://hangover-shakes-tiruppur.senthilkumaran539.chatgpt.site"
          files=(
            index.html
            style.css
            app.js
            assets/alan.png
            assets/brownie.jpg
            assets/burger.jpg
            assets/crew.png
            assets/fries.jpg
            assets/hero.jpg
            assets/logo.jpg
            assets/logo.png
            assets/momos.jpg
            assets/portraits.png
            assets/sandwich.jpg
          )
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          mkdir -p assets
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 --retry-delay 2 "${base}/${file}" --output "${file}"
          done
          touch .nojekyll

      - name: Commit refreshed website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Hangover Shakes website"
            git push
          fi
