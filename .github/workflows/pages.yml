name: Sync and deploy Hangover Shakes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the latest approved website
        shell: bash
        run: |
          set -euo pipefail
          base="https://hangover-shakes-tiruppur.senthilkumaran539.chatgpt.site"
          files=(
            index.html
            style.css
            app.js
            assets/alan.png
            assets/brownie.jpg
            assets/burger.jpg
            assets/crew.png
            assets/fries.jpg
            assets/hero.jpg
            assets/logo.jpg
            assets/logo.png
            assets/momos.jpg
            assets/portraits.png
            assets/sandwich.jpg
          )
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p assets
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 --retry-delay 2 "${base}/${file}" --output "${file}"
          done
          touch .nojekyll

      - name: Save website files to the repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync latest Hangover Shakes website"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
